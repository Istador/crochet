<!doctype html>
<html>
<head>
<script type="text/javascript" src="ntc.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const $file    = document.getElementById('file')
  const $colors  = document.getElementById('colors')
  const $preview = document.getElementById('preview')
  const $pattern = document.getElementById('pattern')
  const $chain   = document.getElementById('chain')
  const $dblfun  = document.getElementById('double')

  const img = document.createElement('img');
  img.setAttribute('alt', 'your picture');

  $file.addEventListener('change', (ev) => {
    ev.preventDefault()
    ev.stopPropagation()
    const f = ev.target.files[0]
    const r = new FileReader()
    r.onloadend = () => { img.src = r.result }
    if (f) { r.readAsDataURL(f) }
  })

  const line = ($cont, text) => {
    const $div = document.createElement('div')
    $div.textContent = text
    $cont.appendChild($div)
  };

  const ul = ($cont, items) => {
    const $ul = document.createElement('ul')
    for (let i of items) {
      let $li = document.createElement('li')
      $li.textContent = i
      $ul.appendChild($li)
    }
    $cont.appendChild($ul)
  };

  render = async () => {
    if (!img.width) { return }

    $colors.innerHTML  = ''
    $preview.innerHTML = ''
    $pattern.innerHTML = ''

    const colors   = []
    const colorMap = {}
    const scCnt    = []
    const chCnt    = []
    const dblfun   = $dblfun.checked
    const chainEnd = $chain.checked
    const corner   = document.querySelector('input[name="corner"]:checked').value * 1

    let lastColor = null
    const ch = (color, size) => (lastColor != color ? '[' + name(lastColor = color) + '] ' : '') + size + 'ch'
    const sc = (color, size) => (lastColor != color ? '[' + name(lastColor = color) + '] ' : '') + size * (dblfun + 1) + 'sc'
    const rgb2hex = (r, g, b) => '#' + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1)
    const name = (idx) => ntc.name(colors[idx])[1].toLowerCase()

    const w    = img.width
    const h    = img.height
    const dh   = h * (dblfun + 1)
    const ydir = (corner < 2 ? -1 :  1)
    let   xdir = (corner % 2 ?  1 : -1)

    const $can = document.createElement('canvas')
    $can.width  = w
    $can.height = h
    $can.setAttribute('style', 'width: 50%; image-rendering: pixelated;')

    const bmp = await createImageBitmap(img, { colorSpaceConversion: 'none' })

    const ctx = $can.getContext('2d', { colorSpace: 'srgb' })
    ctx.drawImage(bmp, 0, 0)

    $preview.appendChild($can)

    const imgData = ctx.getImageData(0, 0, w, h, { pixelFormat: 'rgba-unorm8' })

    const getClr = (x, y) => {
      const r = imgData.data[4 * x + 4 * w * y + 0]
      const g = imgData.data[4 * x + 4 * w * y + 1]
      const b = imgData.data[4 * x + 4 * w * y + 2]
      return rgb2hex(r, g, b)
    }
    const getIdx = (x, y) => colorMap[getClr(x, y)]

    for (let dy = (ydir === 1 ? 0 : dh - 1); 0 <= dy && dy < dh; dy += ydir) {
      const y = (dblfun ? Math.floor(dy / 2) : dy)
      let clr = null
      for (let x = (xdir === 1 ? 0 : w - 1); 0 <= x && x < w; x += xdir) {
        clr = getClr(x, y)
        if (!(clr in colorMap)) {
          colors.push(clr)
          colorMap[clr] = colors.length - 1
          scCnt[colorMap[clr]] = 0
          chCnt[colorMap[clr]] = 0
        }
        scCnt[colorMap[clr]] += 1 + dblfun
      }
      if (clr && chainEnd && dy !== (ydir ? dh - 1 : 0) ) {
        chCnt[colorMap[clr]]++
      }
    }

    let color = getIdx((xdir === 1 ? 0 : w - 1), (ydir === 1 ? 0 : h - 1))
    chCnt[color] += w * (dblfun + 1)

    line($colors, 'Colors:')
    ul($colors, colors.map((hex, i) => name(i) + ' (' + hex + '): ' + scCnt[i] + 'sc ' + (chCnt[i] ? chCnt[i] + 'ch ' : ' ')))
    line($colors, 'Total SC: ' + scCnt.reduce((sum, cur) => sum + cur, 0))
    line($colors, 'Total CH: ' + ((w + (chainEnd ? h : 0)) * (dblfun + 1) - chainEnd))
    line($colors, 'Estimated size (w/ size 3 yarn): ' + w * 0.7 * (dblfun + 1) + ' x ' + h * 0.6 * (dblfun + 1) + ' cm')

    line($pattern, 'R1: [' + name(color) + '] slk ' + w * (dblfun + 1) + 'ch')
    lastColor = color

    for (let dy = (ydir === 1 ? 0 : dh - 1); 0 <= dy && dy < dh; dy += ydir) {
      const y = (dblfun ? Math.floor(dy / 2) : dy)
      let out  = ''
      let inv  = ''
      let size = 0
      for (let x = (xdir === 1 ? 0 : w - 1); 0 <= x && x < w; x += xdir) {
        let clr = getIdx(x, y)
        if (size && clr != color) {
          out += sc(color, size) + ' '
          size = 0
        }
        size++
        color = clr
      }
      xdir = xdir * -1
      if (size) {
        out += sc(color, size) + ' '
      }

      if (dy === (ydir === 1 ? dh - 1 : 0)) {
        out += 'fo'
      } else if (chainEnd) {
        out += ch(color, 1)
      }

      line($pattern, 'R' + ((ydir === 1 ? dy + 1 : dh - dy) + 1) + ': ' + out)
    }
  }

  img.onload       = render
  $dblfun.onchange = render
  $chain.onchange  = render
  document.querySelectorAll('input[name="corner"]').forEach($el => $el.onchange = render)
})
</script>
</head>
<body>
  <div>
    <input id="file" type="file" accept="image/*"/>
  </div>
  <div>
    <input type="checkbox" id="double"/> Double the fun (1 px = 4 sc)
  </div>
  <div>
    <input type="checkbox" id="chain" checked="checked"/> Turning chain at row ends
  </div>
  <div>
    Start at corner:
    <input type="radio" name="corner" value="3" checked="checked"/> Top Left
    <input type="radio" name="corner" value="2"/> Top Right
    <input type="radio" name="corner" value="1"/> Bottom Left
    <input type="radio" name="corner" value="0"/> Bottom Right
  </div>
  <div id="abbreviations">
    <ul>
      <li>slk: slip knot</li>
      <li>ch: chain</li>
      <li>sc: single crochet (US)</li>
      <li>fo: fasten off</li>
    </ul>
  </div>
  <div id="colors">
  </div>
  <div id="preview">
  </div>
  <div id="pattern">
  </div>
</body>
</html>
